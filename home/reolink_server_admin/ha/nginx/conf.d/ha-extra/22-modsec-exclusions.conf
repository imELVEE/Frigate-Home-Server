# ModSecurity exclusions for known false positives.
modsecurity_rules '
  # Allow health checks with numeric Host header (nginx healthz)
  SecRule REQUEST_URI "@streq /healthz" "id:100920350,phase:1,pass,nolog,ctl:ruleRemoveById=920350"

  # Allow HA webhook image URLs without triggering 932130
  SecRule REQUEST_URI "^/api/webhook/" "id:100932130,phase:1,pass,nolog,ctl:ruleRemoveById=932130"
';
