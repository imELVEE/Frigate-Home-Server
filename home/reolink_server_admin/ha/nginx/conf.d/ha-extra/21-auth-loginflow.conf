modsecurity_rules '
  # Allow HA login flow JSON content-type (CRS 920420) and prevent
  # anomaly-score blocking ONLY for /auth/login_flow requests.
  SecRule REQUEST_URI "@beginsWith /auth/login_flow" "id:1000422,phase:1,pass,nolog,ctl:ruleRemoveById=920420"

  # During the login_flow handshake, keep CRS in DetectionOnly so 949110
  # (anomaly >= threshold) won’t 403 the request. Still audit relevant parts.
  SecRule REQUEST_URI "@beginsWith /auth/login_flow" "id:1000423,phase:1,pass,nolog, \
      ctl:ruleEngine=DetectionOnly, \
      ctl:auditEngine=RelevantOnly, \
      chain"
    SecRule REQUEST_METHOD "^(POST|DELETE)$" "t:none"
';
